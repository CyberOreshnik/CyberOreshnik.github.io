name: Maintain published analytics and Google verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-cloudflare-analytics.yml'
      - 'google24caedb31a201cfd.html'
      - 'crsis47-author-website/google24caedb31a201cfd.html'
      - 'robots.txt'
      - 'crsis47-author-website/robots.txt'
      - 'crsis47-author-website/sitemap.xml'
      - '.github/scripts/check-sitemap.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add beacon to all exported HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('crsis47-author-website')
          beacon = """<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"55663cd4cc6b436aaa1584bbecfb321e"}'></script>"""
          verification_name = 'google24caedb31a201cfd.html'
          verification_text = b'google-site-verification: google24caedb31a201cfd.html'
          for token_path in (Path(verification_name), root / verification_name):
              assert token_path.read_bytes() == verification_text, f'Invalid ownership token: {token_path}'
          pages = [p for p in root.rglob('*.html') if p.name != verification_name]
          assert len(pages) >= 168, f'Expected full multilingual export, found {len(pages)} HTML files'
          modified = 0
          for path in pages:
              html = path.read_text(encoding='utf-8')
              assert '</body>' in html, f'Missing body close: {path}'
              if '55663cd4cc6b436aaa1584bbecfb321e' not in html:
                  path.write_text(html.replace('</body>', beacon + '</body>'), encoding='utf-8')
                  modified += 1
          assert all('55663cd4cc6b436aaa1584bbecfb321e' in p.read_text(encoding='utf-8') for p in pages)
          print(f'Cloudflare analytics verified in {len(pages)} pages; changed {modified}')
          PY
      - name: Commit and publish updated static pages
        run: |
          if ! git diff --quiet -- crsis47-author-website; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crsis47-author-website
            git commit -m "Publish Cloudflare analytics on multilingual pages"
            git push
          fi
      - name: Verify live ownership endpoints after Pages publication
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          expected = b'google-site-verification: google24caedb31a201cfd.html'
          urls = [
              'https://cyberoreshnik.github.io/google24caedb31a201cfd.html',
              'https://cyberoreshnik.github.io/crsis47-author-website/google24caedb31a201cfd.html',
          ]
          for url in urls:
              for attempt in range(36):
                  try:
                      with opener.open(urllib.request.Request(url, headers={'Cache-Control': 'no-cache'}), timeout=15) as response:
                          body = response.read()
                          assert response.status == 200, response.status
                          assert body == expected, repr(body)
                          assert response.url == url, response.url
                      print(f'PASS {url}: HTTP 200; no redirect; {len(body)} exact bytes; {body.decode()}', flush=True)
                      break
                  except Exception as error:
                      if attempt == 35:
                          raise
                      print(f'Waiting for Pages publication: {url}: {error}', flush=True)
                      time.sleep(5)
          PY
      - name: Audit live sitemap, Googlebot access and all 168 canonical URLs
        timeout-minutes: 6
        run: python3 .github/scripts/check-sitemap.py
