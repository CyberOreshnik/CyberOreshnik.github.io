name: Verify published analytics and Google verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-cloudflare-analytics.yml'
      - '.github/scripts/**'
      - '.github/requirements-security.txt'
      - 'google24caedb31a201cfd.html'
      - 'crsis47-author-website/**'
      - 'robots.txt'
  pull_request:
    paths:
      - '.github/workflows/install-cloudflare-analytics.yml'
      - '.github/scripts/**'
      - '.github/requirements-security.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned audit dependency in isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/sitemap-audit"
          "$RUNNER_TEMP/sitemap-audit/bin/python" -m pip install --require-hashes -r .github/requirements-security.txt
      - name: Verify committed analytics and ownership tokens without modifying files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('crsis47-author-website')
          name = 'google24caedb31a201cfd.html'
          expected = b'google-site-verification: google24caedb31a201cfd.html'
          for path in (Path(name), root / name):
              if path.read_bytes() != expected:
                  raise ValueError(f'Invalid ownership token: {path}')
          pages = [p for p in root.rglob('*.html') if p.name != name]
          if len(pages) < 182:
              raise ValueError('Incomplete multilingual export')
          for path in pages:
              if '55663cd4cc6b436aaa1584bbecfb321e' not in path.read_text(encoding='utf-8'):
                  raise ValueError(f'Missing public analytics site identifier: {path}')
          print(f'PASS: analytics in {len(pages)} pages; exact ownership files')
          PY
      - name: Test XML rejection and optimization-safe checks
        run: |
          "$RUNNER_TEMP/sitemap-audit/bin/python" .github/scripts/test-sitemap.py
          "$RUNNER_TEMP/sitemap-audit/bin/python" -O .github/scripts/test-sitemap.py
      - name: Check all 182 committed canonical pages
        run: '"$RUNNER_TEMP/sitemap-audit/bin/python" .github/scripts/check-sitemap.py --static-only'
      - name: Audit live sitemap and Googlebot access
        if: github.event_name != 'pull_request'
        timeout-minutes: 6
        run: '"$RUNNER_TEMP/sitemap-audit/bin/python" .github/scripts/check-sitemap.py'
